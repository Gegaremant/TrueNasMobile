Name: TrueNasMobile

RepoType: git
Repo: https://github.com/Gegaremant/TrueNasMobile.git

Builds:
  - versionName: 1.0.4
    versionCode: 10004
    commit: v1.0.2
    subdir: app
    gradle:
      - assembleGithubRelease
    # The build produces one APK per ABI (no universal APK), so F-Droid has to
    # be told which artifacts to publish. Keep these in sync with
    # `splits.abi.include` in app/build.gradle.kts.
    output:
      - app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk
      - app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk
      - app/build/outputs/apk/github/release/app-github-x86_64-release.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.4
CurrentVersionCode: 10004
